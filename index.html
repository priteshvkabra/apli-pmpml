<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Apli PMPML Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: a working phone on the left, a plain-language note on the right that follows whatever screen is open; a second tab lines up today's app against the new screens. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --fg:#18201A; --muted:#566159; --line:#D5DBD5;
  --accent:#3E7F49; --accent-soft:#DDEBDF; --note:#8A5410; --note-soft:#F5E8D6;
  --display:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111512; --surface:#1A201C; --fg:#E6ECE7; --muted:#A1ADA4; --line:#2E3831;
  --accent:#7DC38B; --accent-soft:#1E3324; --note:#E5A75C; --note-soft:#3A2A16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#1A201C; --fg:#E6ECE7; --muted:#A1ADA4; --line:#2E3831;
  --accent:#7DC38B; --accent-soft:#1E3324; --note:#E5A75C; --note-soft:#3A2A16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;position:relative}
.about{position:absolute;top:24px;right:20px;z-index:20}
.about-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:700 15px/1 Georgia,"Times New Roman",serif;font-style:italic;cursor:pointer;display:grid;place-items:center}
.about-btn:hover,.about-btn[aria-expanded="true"]{color:var(--fg);border-color:var(--muted)}
.about-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.about-pop{position:absolute;top:40px;right:0;width:min(280px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;color:var(--muted);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.about-pop b{color:var(--fg);font-weight:600}
@media (max-width:480px){.about{top:20px;right:16px}}
.wrap h1{padding-right:44px}
.label{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--note);background:var(--note-soft);padding:4px 10px;border-radius:4px;font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:14px 0 8px;text-wrap:balance}
h1 .mr{font-family:"Noto Sans Devanagari",var(--display);font-weight:600;color:var(--accent);font-size:.55em;display:block;margin-top:8px}
.lede{max-width:68ch;color:var(--muted);margin:0 0 14px}
.lede b{color:var(--fg)}
details.primer{max-width:68ch;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 22px}
details.primer summary{cursor:pointer;font-weight:600}
details.primer p{margin:8px 0 2px;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 15px var(--body);padding:10px 14px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.steps-list button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
.phone-col{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:8px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.ctrl-k{font-size:12px;color:var(--muted);text-align:center}
.notes{min-width:0}
.step-k{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.notes h2{font-family:var(--display);font-size:28px;line-height:1.15;margin:4px 0 12px;text-wrap:balance}
.rows{display:grid;gap:10px;margin:12px 0 18px;max-width:62ch}
.rows div{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:baseline}
.rows b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rows .n b{color:var(--accent)}
.chap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 4px}
.steps-list{list-style:none;padding:0;margin:0;display:grid;gap:2px;max-width:62ch}
.steps-list button{width:100%;text-align:left;background:none;border:0;color:var(--muted);font:14px var(--body);padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:10px}
.steps-list .num{font-variant-numeric:tabular-nums;width:20px;flex:none}
.steps-list button[aria-current="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);max-width:90ch}
/* flow board */
.flow{display:grid;gap:34px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px) minmax(0,220px);gap:22px;align-items:start;padding-bottom:30px;border-bottom:1px solid var(--line)}
@media (max-width:760px){.frow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.frow .ftxt{grid-column:1/-1}}
.ftxt{position:sticky;top:16px}
.ftxt h3{font-family:var(--display);font-size:22px;line-height:1.15;margin:2px 0 8px;text-wrap:balance}
.ftxt p{margin:0 0 8px;color:var(--muted);max-width:52ch}
.ftxt p b{color:var(--fg)}
.fcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.fcol .cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.fcol .cap.n{color:var(--accent)}
.dev{width:100%;border-radius:18px;border:6px solid #0E0E0E;overflow:hidden;background:#0E0E0E}
.dev-in{position:relative;width:100%;aspect-ratio:320/650;overflow:hidden;background:#F7F7F7}
.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.mini .scr{position:absolute;left:0;top:0;width:393px;height:798.28px;border-radius:0;transform-origin:top left;pointer-events:none}
.none{aspect-ratio:320/650;border:1px dashed var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);font-size:13px}

/* ---------- Phone: Apli PMPML v1.4.0 look, fixed light ---------- */
.phone{width:100%;max-width:360px;aspect-ratio:360/740;background:#0E0E0E;border-radius:46px;padding:9px;box-shadow:0 24px 50px rgba(0,0,0,.18)}
.scr{--g:#489054;--gd:#84BA96;--ok:#3C7E42;--bad:#CC6C66;--pg:#F7F7F7;--bg2:#F1F1F1;--card:#F0F0F0;--tile:#E4F0FC;--ink:#111;--sub:#7A7A7A;--ln:#C9C9C9;--amb:#E07B39;--ambs:#FBE9DD;
  position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--pg);color:var(--ink);
  font-family:-apple-system,"SF Pro Text",system-ui,"Noto Sans Devanagari",sans-serif;font-size:14px;line-height:1.35;display:flex;flex-direction:column}
.scr.grey{background:var(--bg2)}
:where(.scr button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr button:focus-visible,.scr input:focus-visible{outline:2px solid #2B6CB0;outline-offset:2px}
.scr svg{display:block}
.sb{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600}
.sb .r{display:flex;gap:5px;align-items:center}
.body{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
/* top bars */
.hbar{display:flex;align-items:center;gap:16px;padding:8px 18px 12px}
.hbar h4{margin:0;font-size:18px;font-weight:400;flex:1}
.hbar.white{background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.08);padding:12px 18px}
.hbar.white h4.b{font-weight:700}
.timer{background:var(--g);color:#fff;font-weight:600;font-size:15px;padding:3px 12px;border-radius:14px;font-variant-numeric:tabular-nums}
.hometop{background:#fff;border-bottom:1px solid #DADADA;display:flex;align-items:center;padding:6px 16px 8px;gap:14px}
.mark{width:44px;height:44px;border-radius:50%;border:1.5px solid #CFCFCF;display:flex;align-items:center;justify-content:center;color:#C33}
.hometop .sp{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center}
/* home */
.search{margin:14px 16px 0;background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:9px}
.search .pill{background:#D4D4D4;border-radius:22px;display:flex;align-items:center;gap:12px;padding:9px 16px;font-family:"Noto Sans Devanagari",sans-serif;font-size:17px;width:100%}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 16px 0}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 16px 0}
.tile{display:flex;flex-direction:column;gap:8px}
.tile .t{background:var(--tile);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;height:58px}
.tiles4 .t{height:60px}
.tile span{font-size:14px;line-height:1.2}
.tiles2 .tile span{text-align:center}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 16px 8px}
.sec h5{margin:0;font-size:18px;font-weight:700}
.sec .lnk{text-decoration:underline;font-size:14px}
.sec .mr{font-family:"Noto Sans Devanagari",sans-serif;font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.upibar{margin:14px 16px 0;background:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.upibar .ic{width:36px;height:36px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;flex:none}
.upibar .tx{flex:1;min-width:0}
.upibar .tx b{display:block;font-size:14px}
.upibar .tx span{font-size:12px;color:var(--sub)}
.gbtn{background:var(--g);color:#fff!important;font-weight:600;border-radius:8px;padding:7px 12px;font-size:13px;white-space:nowrap}
.gbtn.out{background:#fff;color:var(--g)!important;border:1px solid var(--g)}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 6px;scroll-padding:0 16px;scrollbar-width:none;cursor:grab}
.car::-webkit-scrollbar{display:none}
.trip{flex:0 0 84%;scroll-snap-align:start;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:12px 14px;display:flex;flex-direction:column;gap:8px;user-select:none}
.trip .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
.trip .tag{background:var(--card);border-radius:10px;padding:2px 8px;font-size:11px;color:#444}
.trip .od{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.25}
.trip .meta{font-size:13px;color:var(--sub)}
.trip .rt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trip .rt .k{font-size:12px;color:var(--sub);flex-basis:100%}
.rchip{border:1.5px solid var(--g);color:var(--g)!important;font-weight:700;border-radius:8px;padding:5px 12px;font-size:15px;background:#fff}
.rchip:active,.rchip.on{background:var(--g);color:#fff!important}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 0}
.dots i{width:6px;height:6px;border-radius:50%;background:#C4C4C4;display:block}
.dots i.on{background:var(--g);width:16px;border-radius:3px}
.dots i[data-act]{cursor:pointer;outline:6px solid transparent}
.scr [data-act]{cursor:pointer}
.field textarea{width:100%;border:1.5px solid #CFCFCF;border-radius:6px;background:#fff;font:16px -apple-system,system-ui,sans-serif;padding:12px;color:#111;resize:none}
.mini{cursor:pointer}
.mini .sb{display:none}
.near{margin:0 16px;background:#D4D4D4;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.near .row{display:flex;align-items:center;gap:12px;width:100%;font-size:15px}
.near .row small{display:block;color:#555;font-size:12px}
.busdot{width:30px;height:30px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;flex:none}
.mapbox{margin:16px 16px 18px;background:#fff;border-radius:12px;padding:12px 12px 0;overflow:hidden}
.mapbox h6{margin:0 0 8px;font-size:18px}
.mapbox .m{height:70px;background:linear-gradient(170deg,#D7EBB0 0 45%,#9C9C9C 45% 48%,#D7EBB0 48%)}
.tabbar{flex:none;background:#fff;border-top:1px solid #E2E2E2;display:grid;grid-template-columns:repeat(3,1fr);padding:6px 0 16px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;color:#9A9A9A!important;font-size:14px}
.tabbar button.on{color:#111!important;font-weight:600}
/* ticket form card */
.tcard{margin:4px 16px 0;border-radius:22px;overflow:hidden;position:relative;border:1.5px solid var(--ln);background:var(--card)}
.tcard .hd{background:var(--g);color:#fff;font-size:16px;padding:12px 18px;font-variant-numeric:tabular-nums}
.tcard .sec1{padding:14px 16px 12px}
.rrow{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1.5px solid #D2D2D2;width:100%}
.bicon{width:52px;height:52px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;flex:none}
.rrow .tx{flex:1;min-width:0}
.rrow .tx b{font-size:20px;display:block;font-weight:600}
.rrow .tx span{font-size:14px}
.sel{flex:1;border:1px solid #D6D6D6;border-radius:4px;background:#F3F3F3;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;color:#666!important;font-size:17px}
.stop{display:flex;gap:12px;align-items:flex-start;margin-top:12px;width:100%}
.stop .ring{width:18px;height:18px;border-radius:50%;border:5px solid #888;flex:none;margin-top:2px}
.stop .tx{flex:1;min-width:0}
.stop .tx span{color:#888;font-size:15px;display:block}
.stop .tx b{font-size:18px;font-weight:600;display:block;line-height:1.2;margin-top:2px}
.notch{position:relative;height:22px}
.notch:before,.notch:after{content:"";position:absolute;top:0;width:22px;height:22px;border-radius:50%;background:var(--pg);border:1.5px solid var(--ln)}
.notch:before{left:-12px}.notch:after{right:-12px}
.notch i{position:absolute;left:24px;right:24px;top:10px;border-top:1.5px dashed #BDBDBD}
.sec2{padding:6px 16px 16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.seg button{border:1.5px solid #D4D4D4;background:#F9F9F9;border-radius:6px;padding:9px 0;text-align:center;font-size:16px}
.seg button.on{background:var(--g);color:#fff!important;border-color:var(--g)}
.lbl{color:#888;font-size:15px;margin:14px 0 6px}
.fares{display:flex;gap:10px}
.fares button{border:1.5px solid #D4D4D4;background:#F9F9F9;border-radius:6px;width:44px;height:40px;text-align:center;font-size:16px}
.fares button.on{border-color:var(--g);background:#E6F1E8;font-weight:700}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.qty .nm{font-size:17px}
.qty .nm b{display:block;font-size:19px}
.stp{display:flex;align-items:center;gap:14px}
.stp button{width:28px;height:44px;border:1.5px solid #D4D4D4;border-radius:6px;background:#F9F9F9;text-align:center;color:#888!important;font-size:18px}
.stp .v{width:48px;height:44px;border:1.5px solid #D4D4D4;border-radius:8px;background:#F9F9F9;display:flex;align-items:center;justify-content:center;font-size:20px}
.paybar{flex:none;padding:10px 14px 22px}
.paybtn{width:100%;background:var(--g);color:#fff!important;border-radius:6px;padding:14px 0;text-align:center!important;font-size:21px;font-weight:700;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.paybtn[disabled]{background:var(--gd);cursor:default}
.paybtn.sm{font-size:17px;padding:12px 0}
.linkbtn{display:block;width:100%;text-align:center!important;color:#555!important;font-size:14px;padding:10px 0 0;text-decoration:underline}
.lrow{display:flex;gap:8px}
.lrow .linkbtn{flex:1;width:auto}
/* coach */
.coach{position:absolute;left:12px;right:12px;z-index:6;background:#1E1E1E;color:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.coach .s{font-size:11px;color:#BDBDBD;letter-spacing:.04em}
.coach b{display:block;font-size:16px;margin-top:2px}
.coach .mr{font-family:"Noto Sans Devanagari",sans-serif;font-size:13px;color:#CFE6D3}
.coach .act{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.coach .act button{color:#fff!important;font-size:14px}
.coach .act .nx{background:var(--g);padding:6px 14px;border-radius:6px;font-weight:600}
.hl{outline:3px solid #F2B33D;outline-offset:3px;border-radius:8px;position:relative;z-index:5}
/* lists */
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin:0 16px 12px;padding:12px 14px}
.lt{display:flex;align-items:center;gap:10px}
.lt b{font-size:18px;font-weight:700;flex:1}
.pill{border-radius:12px;padding:2px 10px;font-size:13px;color:#fff;background:var(--ok)}
.pill.ex{background:#9E9E9E}
.pill.con{background:#fff;color:#555;border:1px solid #BDBDBD}
.lod{margin:8px 0 8px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lf{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #E3E3E3;padding-top:8px;color:var(--sub);font-variant-numeric:tabular-nums}
.lf b{color:var(--ink);font-size:16px}
.lf .gbtn{padding:5px 10px}
.pagehd{margin:4px 16px 12px}
.pagehd b{font-size:22px;display:block}
.pagehd span{color:var(--sub);font-size:14px}
.field{margin:0 16px}
.field label{display:block;font-size:14px;color:#555;margin:0 0 6px}
.field input{width:100%;border:1.5px solid #CFCFCF;border-radius:6px;background:#fff;font:17px -apple-system,system-ui,sans-serif;padding:12px;color:#111}
.field input.bad{border-color:var(--bad)}
.hint{margin:8px 16px 0;font-size:13px;color:var(--sub)}
.warn{margin:12px 16px 0;background:var(--ambs);color:var(--amb);border-radius:10px;padding:10px 12px;font-size:14px}
.steps3{margin:0 16px 14px;padding:12px 14px 12px 34px;background:#F3F8F3;border-radius:10px;font-size:14px;line-height:1.45;color:#222}
.steps3 li{margin:3px 0}
.fine{margin:4px 16px 0;font-size:12px;color:var(--sub)}
.opt .tx .lu{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--ok);background:#E6F1E8;border-radius:4px;padding:1px 6px;vertical-align:2px}
.okbox{margin:12px 16px 0;background:#E6F1E8;color:var(--ok);border-radius:10px;padding:10px 12px;font-size:14px}
.err{color:var(--bad);font-size:13px;margin:6px 16px 0;min-height:18px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;margin:0 16px 10px;padding:14px;width:calc(100% - 32px);border:1.5px solid transparent}

function fareOf(route, from, to){
  const st = ROUTES[route]; const a = st.indexOf(from), b = st.indexOf(to);
  if (a < 0 || b < 0 || a === b) return null;
  const d = Math.abs(a - b);
  return d <= 2 ? 10 : d <= 5 ? 20 : 30;
}
function dirOf(route, from, to){
  const st = ROUTES[route]; const a = st.indexOf(from), b = st.indexOf(to);
  if (a < 0) return t('Towards {0}', sn(st[st.length-1]));
  return t('Towards {0}', sn(b >= 0 && b < a ? st[0] : st[st.length-1]));
}
function routesFor(from, to){ return Object.keys(ROUTES).filter(r => ROUTES[r].includes(from) && ROUTES[r].includes(to) && from !== to); }

/* Daily pass suggestion, from the rider's own days. Shown before the first ticket of the day,
   and only when most recent days cost more than the pass: money already spent can't be saved. */
const PASS = 70;
function usualDay(){
  if (!S.hist) return null;
  const amt = {}, trips = {};
  APP.forEach(x => { amt[x.d] = (amt[x.d]||0) + x.f*x.n; trips[x.d] = (trips[x.d]||0) + 1; });
  const days = Object.keys(amt), over = days.filter(d => amt[d] > PASS);
  if (over.length * 2 <= days.length) return null;
  return {days:over.length, of:days.length, trips:Math.max(...over.map(d=>trips[d])), amt:Math.max(...over.map(d=>amt[d]))};
}

const NEAR = () => S.am

  : [['Ruby Hall',120],['Bund Garden',650],['Pune Station Moledina Stand',1400],['Shivajinagar',2600],['Alankar Talkies',2900]];
function nearestOn(route){ const n = NEAR().find(([st]) => ROUTES[route].includes(st)); return n ? {stop:n[0], m:n[1]} : null; }
function autoFrom(d){ if (!S.loc || !d.route || (d.from && !d.auto)) return; const n = nearestOn(d.route); if (n){ d.from = n.stop; d.auto = n.m; if (d.to === d.from) d.to = ''; } }

const norm = s => String(s).toLowerCase().replace(/[\s.\-()]+/g,'');
function stopMatch(stop, q){
  const n = norm(q); if (!n) return {ok:true};
  if (norm(stop).includes(n) || (STOPS[stop] && norm(STOPS[stop]).includes(n))) return {ok:true};
  const a = (ALIAS[stop]||[]).find(x => norm(x).includes(n) || (n.length >= 4 && n.includes(norm(x))));
  return a ? {ok:true, via:a} : {ok:false};
}
function stopList(){
  const sh = S.sheet, d = S.draft; if (!sh) return '';
  const base = d.route ? ROUTES[d.route] : [...new Set(Object.values(ROUTES).flat())];
  const list = base.filter(s => sh.kind === 'to' ? s !== d.from : true).map(s => [s, stopMatch(s, S.q)]).filter(x => x[1].ok);
  if (!list.length) return `<p class="sub" style="padding:12px 2px">${t('No stop found. Try another name.')}</p>`;
  return list.map(([s,m]) => `<button class="li" data-act="pick" data-arg="${sh.kind}|${esc(s)}"><span class="ring" style="width:14px;height:14px;border:4px solid #888;border-radius:50%;flex:none"></span><span>${snBoth(s)}${m.via?`<small class="al">${t('Also called “{0}”', esc(m.via))}</small>`:''}</span></button>`).join('');
}
/* In lists, a Marathi or Hindi stop name keeps the English one underneath, to match either board */
const snBoth = s => S.lang !== 'en' && STOPS[s] ? `${esc(STOPS[s])}<small>${esc(s)}</small>` : esc(s);
const dt = d => S.lang === 'en' ? d : d.replace('Oct', S.lang === 'mr' ? 'ऑक्टो' : 'अक्टू');
const ptype = p => p === 'All Route' ? t('All Route') : p;
const langName = () => LANGS.find(l => l[0] === S.lang)[1];

/* Usual trips: group the rider's own tickets by stop pair, the right direction first for the time of day */
function usual(){
  const src = (S.hist ? APP : []).concat(S.booked);
  const m = new Map();
  src.forEach(x => {
    const k = x.from + '|' + x.to;
    if (!m.has(k)) m.set(k, {from:x.from, to:x.to, f:x.f, count:0, last:x});
    m.get(k).count++;
  });
  const arr = [...m.values()].map(g => ({...g, routes:routesFor(g.from, g.to)}));
  const home = 'Kharadi Gaon';
  arr.sort((a,b) => (S.am ? (b.from===home) - (a.from===home) : (b.to===home) - (a.to===home)) || b.count - a.count);
  return arr.slice(0, 3);
}

/* Pune Metro, unchanged from today; example fares */
const METRO = ['PCMC','Sant Tukaram Nagar','Bhosari (Nashik Phata)','Kasarwadi','Phugewadi','Dapodi','Bopodi','Shivaji Nagar','Civil Court','Budhwar Peth','Mandai','Swargate'];
function mfare(a,b){ const i=METRO.indexOf(a), j=METRO.indexOf(b); if(i<0||j<0||i===j) return 0; const d=Math.abs(i-j); return d<=2?10:d<=5?20:d<=8?25:30; }
const QR = (() => { let r=7, h=''; const N=21; const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){ if ((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12)) continue; r=(r*9301+49297)%233280; if (r/233280>0.5) h+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`; }
  return `<svg width="150" height="150" viewBox="-1 -1 23 23" style="background:#fff" aria-label="QR">${fin(0,0)}${fin(14,0)}${fin(0,14)}${h}</svg>`; })();

function sheetHTML(){
  const sh = S.sheet; if (!sh) return '';
  let h = `<div class="dim" data-act="sheetclose"><div class="sheet" data-stop="1" role="dialog"><div class="grab"></div>`;
  const d = S.draft;
  if (sh.kind === 'route') {
    const opts = d.from && d.to ? routesFor(d.from, d.to) : d.from ? Object.keys(ROUTES).filter(r=>ROUTES[r].includes(d.from)) : Object.keys(ROUTES);
    h += `<h6>${t('Select Route')}</h6><div class="sub">${t('Read it on the bus, or ask the conductor')}</div>${opts.map(r=>`<button class="li" data-act="pick" data-arg="route|${r}">${I.bus('#111',22)}<span><b>${r}</b><small>${dirOf(r, d.from, d.to)}</small></span></button>`).join('')}`;
  } else if (sh.kind === 'from' || sh.kind === 'to') {
    h += `<h6>${sh.kind==='from'?t('Starting stop'):t('Ending stop')}</h6><div class="sub">${d.route?t('Stops on {0}', d.route):t('All stops')}</div>
      <div class="field" style="margin:0 0 4px"><input id="stopq" type="search" autocomplete="off" placeholder="${esc(t('e.g. station, रेल्वे, kharadi'))}" aria-label="${esc(t('Type the stop as you’d say it'))}" value="${esc(S.q)}"></div>
      <div id="stoplist">${stopList()}</div>`;
  } else if (sh.kind === 'quick') {
    h += `<h6>${t('Book again·h')}</h6><div class="sub">${t('Check, then pay')}</div><div class="sum"><div class="r1"><span class="bicon" style="width:40px;height:40px">${I.bus('#fff',20)}</span><span><b>${sh.r}</b><br><span>${dirOf(sh.r, sh.from, sh.to)}</span></span></div><div class="od">${esc(sn(sh.from))} → ${esc(sn(sh.to))}</div><div class="r2"><span>${t('{0} Full', 1)}</span><b>₹${sh.amt}</b></div><div style="font-size:12px;color:#7A7A7A;margin-top:4px">${t('Valid till {0} · this bus number only', TM().vt)}</div></div>`;
    const tip = passTip();
    if (tip) h += `<div class="passbox"><b>${t('Most days, a pass costs less')}</b><span>${t('On {0} of your last {1} days you took {2} buses, ₹{3} in all. A daily pass is ₹70 and covers every bus till midnight.', tip.days, tip.of, tip.trips, tip.amt)}</span><button class="paybtn sm" data-act="quickpass">${t('Buy today’s pass · ₹70')}</button></div>`;
    h += payUsual(sh.amt) + `<div class="lrow"><button class="linkbtn" data-act="go" data-arg="payapp">${t('Other ways to pay')}</button><button class="linkbtn" data-act="quickedit">${t('Change stops')}</button></div>`;
  } else if (sh.kind === 'share') {
    h += `<h6>${t('Share Apli PMPML')}</h6><div class="sub">${t('Send this to family and friends')}</div><div class="sum" id="sharemsg" style="font-size:15px;line-height:1.45">${esc(t(SHARE_MSG))}</div><button class="paybtn sm" data-act="copylink" style="margin-top:12px">${t('Copy message')}</button>`;
  } else if (sh.kind === 'rate') {
    h += `<h6>${t('Rate Apli PMPML')}</h6><div class="sub">${t('How was booking today?')}</div><div style="display:flex;gap:6px;justify-content:center;margin:10px 0 16px">${[1,2,3,4,5].map(n=>`<button data-act="star" data-arg="${n}" aria-label="${t('{0} stars', n)}">${starSvg(n<=S.stars)}</button>`).join('')}</div><button class="paybtn sm" data-act="ratesend" ${S.stars?'':'disabled'}>${t('Submit')}</button>`;
  } else if (sh.kind === 'mfrom' || sh.kind === 'mto') {
    const k = sh.kind === 'mfrom' ? 'from' : 'to', other = k === 'from' ? S.mdraft.to : S.mdraft.from;
    h += `<h6>${k==='from'?t('From station'):t('To station')}</h6><div class="sub">${t('Pune Metro, Purple Line')}</div>${METRO.filter(x=>x!==other).map(x=>`<button class="li" data-act="mpick" data-arg="${k}|${esc(x)}"><span class="ring" style="width:14px;height:14px;border:4px solid #888;border-radius:50%;flex:none"></span><span>${snBoth(x)}</span></button>`).join('')}`;
  } else if (sh.kind === 'qpass') {
    h += `<h6>${t('Today’s pass')}</h6><div class="sub">${t('Same as last time · no ID to say out loud')}</div><div class="sum"><div class="r1"><b style="font-size:19px">PMC &amp; PCMC</b></div><div class="r2"><span>${t('ID ending {0}', S.passId)}</span><b>₹70.83</b></div><div style="font-size:12px;color:#7A7A7A;margin-top:4px">${t('₹70 pass + ₹0.83 payment fee')}</div></div>`;
    h += payUsual(70.83) + `<div class="lrow"><button class="linkbtn" data-act="go" data-arg="payapp">${t('Other ways to pay')}</button><button class="linkbtn" data-act="go" data-arg="pass">${t('Change pass type')}</button></div>`;
  } else if (sh.kind === 'lang') {
    h += `<h6>${t('App language')}</h6><div class="sub">${t('The whole app changes to this language.')}</div>${LANGS.map(([k,n,s])=>`<button class="li${S.lang===k?' cur':''}" data-act="setlang" data-arg="${k}"><span class="rad2"></span><span><b>${n}</b><small>${s}</small></span></button>`).join('')}`;
  }
  return h + `</div></div>`;
}

/* ---------- render ---------- */
const scr = $('#screen');
function html(){
  let h = (V[S.screen] || V.home)();
  h += sheetHTML();
  if (S.toast) h += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  return h;
}
function render(){
  scr.className = 'scr' + (S.screen==='lang' ? ' lang' : '') + (['payapp','alltickets','found','profile','help','buses','notif','ticket','passview','complaints','metroticket'].includes(S.screen) ? ' grey' : '');
  scr.innerHTML = html();
  wire();
  notes();
}
function go(n, push=true){ if (push && S.screen !== n) S.stack.push(S.screen); S.screen = n; S.sheet = null; render(); scr.querySelector('.body') && (scr.querySelector('.body').scrollTop = 0); }
function back(){ if (S.sheet){ S.sheet=null; return render(); } S.coach = -1; S.screen = S.stack.pop() || 'home'; render(); }
function toast(t){ S.toast = t; render(); clearTimeout(toast.h); toast.h = setTimeout(()=>{ S.toast=''; render(); }, 1600); }
let nextNo = 4471;
function makeTicket(){
  const d = S.draft; const fare = d.mode==='stop' ? fareOf(d.route,d.from,d.to) : d.fare;
  S.ticket = {r:d.route, from:d.from, to:d.mode==='stop'?d.to:'', fare:d.fare, full:d.full, half:d.half, amt:fare*d.full + Math.round(fare/2)*d.half, t:TM().bk, no:nextNo++};
  S.today.push(S.ticket.amt);
  if (d.mode==='stop') S.booked.push({d:'12 Oct', t:TM().bk, r:d.route, from:d.from, to:d.to, f:fare, n:d.full||1, src:'App'});
}

/* ---------- actions ---------- */
const A = {
  back, home(){ S.stack=[]; S.coach=-1; S.after=''; go('home', false); },
  go(n){ if (n==='payapp' && S.sheet && S.sheet.amt) S.payAmt=S.sheet.amt; go(n); },
  toast,

scr.addEventListener('click', e => {
  if (drag.moved) { e.preventDefault(); e.stopPropagation(); drag.moved=false; return; }

  if (!el || !scr.contains(el)) return;
  if (el.dataset.act==='sheetclose' && e.target.closest('[data-stop]')) return;
  if (el.disabled) return;

});

});

/* mouse drag-to-swipe for carousels (touch and trackpad swipe natively) */
const drag = {el:null,x:0,sl:0,moved:false};
scr.addEventListener('mousedown', e => { const c=e.target.closest('.car,.tcar'); if(!c) return; drag.el=c; drag.x=e.clientX; drag.sl=c.scrollLeft; drag.moved=false; c.style.scrollSnapType='none'; });
window.addEventListener('mousemove', e => { if(!drag.el) return; const dx=e.clientX-drag.x; if(Math.abs(dx)>5) drag.moved=true; drag.el.scrollLeft=drag.sl-dx; });
window.addEventListener('mouseup', e => { if(!drag.el) return; const c=drag.el; drag.el=null;
  const w = c.classList.contains('tcar') ? c.clientWidth : (c.firstElementChild ? c.firstElementChild.offsetWidth + 10 : c.clientWidth);
  const dx = e.clientX - drag.x; let i = Math.round(drag.sl / w); if (dx < -40) i++; else if (dx > 40) i--;
  c.style.scrollSnapType=''; c.scrollTo({left:Math.max(0,i*w), behavior:'smooth'}); });

function wire(){
  const car=$('#tripcar');
  if (car) car.addEventListener('scroll', () => { const w=car.firstElementChild.offsetWidth+10; const i=Math.min(car.children.length-1, Math.round(car.scrollLeft/w)); document.querySelectorAll('#tripdots i').forEach((d,k)=>d.classList.toggle('on',k===i)); }, {passive:true});
}
